[project]
name = "tg-bot"
version = "0.1.0"
description = "TG-bot frontend service"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "aiogram>=3.25.0",
    "apscheduler>=3.11.2",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic-settings>=2.12.0",
    "redis>=7.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]