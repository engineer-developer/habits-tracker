[project]
name = "habits-tracker"
version = "0.1.0"
description = "Habit tracker service"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "fastapi-app",
    "tg-bot"
]

[tool.uv.sources]
fastapi-app = { workspace = true }
tg-bot = { workspace = true }

[tool.uv.workspace]
members = ["fastapi-app", "tg-bot"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
]
