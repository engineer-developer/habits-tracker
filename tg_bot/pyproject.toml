[project]
name = "tg-bot"
version = "0.1.0"
description = ""
authors = [
    {name = "Alex Suslov",email = "suslov.lexx@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "pytelegrambotapi (>=4.29.1,<5.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "redis (>=7.0.1,<8.0.0)",
    "apscheduler (>=3.11.0,<4.0.0)"
]

[tool.poetry]
packages = [{include = "tg_bot", from = "src"}]


[tool.poetry.group.dev.dependencies]
ruff = "^0.13.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
